@let cancha = this.cancha();
@let loading = this.loading();

@if (loading) {
    <p class="status-msg">Cargando cancha...</p>
} @else if (!cancha) {
    <p class="status-msg">La cancha buscada no existe.</p>
} @else {
    <main>
        <section class="crud-container">
            <div class="container-header">
                <span class="header-tag">⚽ Cancha</span>
                <h2>Datos de cancha</h2>
            </div>

            <form [formGroup]="form" (ngSubmit)="handleSubmit()">
                <label>Nombre
                    <input type="text" formControlName="name" [placeholder]="cancha.canchaType">
                    @if(form.get('name')?.hasError('required') && (form.get('name')?.touched || form.get('name')?.dirty) ){
                        <span class="field-error">El nombre es obligatorio</span>
                    }
                </label>

                <label>Dirección
                    <input type="text" formControlName="address" [placeholder]="cancha.working || 'Dirección'">
                    @if(form.get('address')?.hasError('required') && (form.get('address')?.touched || form.get('address')?.dirty) ){
                        <span class="field-error">La dirección es obligatoria</span>
                    }
                </label>

                <label class="checkbox-label">
                    <input type="checkbox" formControlName="canShower">
                    ¿Tiene duchas?
                </label>

                <div class="form-actions">
                    <button type="reset" class="reset-btn">Limpiar</button>
                    <button type="submit" class="save-btn">Guardar</button>
                </div>
            </form>

            <button class="delete-btn" (click)="handleDelete()">🗑️ Borrar Sucursal</button>
        </section>
    </main>
}
