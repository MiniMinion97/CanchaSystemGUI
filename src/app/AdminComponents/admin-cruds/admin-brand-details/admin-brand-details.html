@let brand = this.brand();
@let loading = this.loading();

@if (loading) {
    <p class="status-msg">Cargando marca...</p>
} @else if (!brand) {
    <p class="status-msg">La marca buscada no existe.</p>
} @else {
    <main>
        <section class="crud-container">
            <div class="container-header">
                <span class="header-tag">🏷️ Marca</span>
                <h2>{{brand.brandName}}</h2>
            </div>

            <form [formGroup]="form" (ngSubmit)="handleSubmit()">
                <label>Nombre
                    <input type="text" formControlName="brandName" [placeholder]="brand.brandName || 'Nombre de la Marca'">
                    @if(form.get('brandName')?.hasError('required') && (form.get('brandName')?.touched || form.get('brandName')?.dirty) ){
                        <span class="field-error">El nombre es obligatorio</span>
                    }
                </label>

                <div class="form-actions">
                    <button type="reset" class="reset-btn">Limpiar</button>
                    <button type="submit" class="save-btn">Guardar</button>
                </div>
            </form>

            <button class="delete-btn" (click)="handleDelete()">🗑️ Borrar Marca</button>
        </section>

        <section class="nested-section">
            <app-admin-establishments [type]="'brand'" [targetId]="id"></app-admin-establishments>
        </section>
    </main>
}
