@let reviews = this.reviews();
<main>
    @if(reviews){
    <h2>Reseñas</h2>
    <section>
        @for(review of reviews; track review.id){
            <app-review-item 
                [review]="review"
                (edit)="edit.emit($event)"
                (delete)="delete.emit($event)">
            </app-review-item>
        }
    </section>
}@else {
    <span>Todavia no hay reseñas, sé el primero en compartir tu experiencia</span>
}
</main>
