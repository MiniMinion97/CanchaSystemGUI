@let stars = [5, 4, 3, 2, 1];

<main>
  @if (!isLoggedIn) {
    <p class="warning">⚠️ Debes iniciar sesión para dejar una reseña</p>
  }

  <form [formGroup]="form" (ngSubmit)="handleSubmit()">
    <div class="rating">
      @for(star of stars; track $index){
        <input
          type="radio"
          [id]="'star' + star"
          formControlName="rating"
          [value]="star"
        />
        <label [for]="'star' + star" [title]="star + ' stars'">&#9733;</label>
      }  
    </div>

    <!-- Mostrar error si no seleccionó rating -->
    @if (rating.invalid && (rating.dirty || rating.touched)) {
      <p class="error">Por favor, selecciona una calificación</p>
    }

    <textarea
      formControlName="message"
      placeholder="Escribe tu reseña aquí... (opcional)"
      maxlength="500"
      rows="4"
    ></textarea>

    <!-- Contador de caracteres -->
    @if (message.value) {
      <p class="char-count">{{ message.value.length }} / 500</p>
    }

    <button 
      type="submit" 
      [disabled]="form.invalid || !isLoggedIn"
      
    >

      {{ isEditing() ? 'Actualizar Reseña' : 'Publicar Reseña' }}
    </button>
  </form>
</main>
