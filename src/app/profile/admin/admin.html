<main>
  <div class="admin-hero">
    
    <h1>Panel de Admin</h1>
    <p class="hero-subtitle">Gestioná dueños, clientes, marcas, sucursales y estadísticas del sistema.</p>
  </div>

  <div class="menu-grid">
    <button (click)="goToOwners()">
      <span class="menu-icon">🏢</span>
      <div class="menu-text">
        <h3>Dueños</h3>
        <p>Administrá cuentas de propietarios</p>
      </div>
      <span class="menu-arrow">→</span>
    </button>

    <button (click)="goToClients()">
      <span class="menu-icon">👥</span>
      <div class="menu-text">
        <h3>Clientes</h3>
        <p>Gestioná las cuentas de clientes</p>
      </div>
      <span class="menu-arrow">→</span>
    </button>

    <button (click)="goToBrands()">
      <span class="menu-icon">🏷️</span>
      <div class="menu-text">
        <h3>Marcas</h3>
        <p>Administrá las marcas registradas</p>
      </div>
      <span class="menu-arrow">→</span>
    </button>

    <button (click)="goToEstablishments()">
      <span class="menu-icon">🏟️</span>
      <div class="menu-text">
        <h3>Sucursales</h3>
        <p>Gestioná los establecimientos</p>
      </div>
      <span class="menu-arrow">→</span>
    </button>

    <button (click)="goToStats()">
      <span class="menu-icon">📊</span>
      <div class="menu-text">
        <h3>Estadísticas</h3>
        <p>Mirá el rendimiento general del sistema</p>
      </div>
      <span class="menu-arrow">→</span>
    </button>
  </div>
</main>
