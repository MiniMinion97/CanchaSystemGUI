@let brand = this.brand();

@if (brand) {
  <div class="brand">

    <div class="brand-hero">
      <span class="hero-tag">🏷️ Marca</span>
      <h1>{{ brand.brandName }}</h1>
    </div>

    <button class="primary-action" (click)="toggleCreate()">➕ Crear establecimiento</button>

    @if (creating()) {
      <div class="form-wrap">
        <app-establishment-form [brandId]="brand.id"></app-establishment-form>
      </div>
    }

    <hr />

    <div class="btnActions">
      <button class="danger-btn" (click)="handleDelete()">🗑️ Borrar</button>
      <button class="edit-btn" (click)="toggleEdit()">✏️ Editar</button>
    </div>

    @if (isEditing()) {
      <div class="form-wrap">
        <app-brand-form
          [brandData]="brand"
          [brandId]="brand.id"
          [isEditing]="true"
          (brandEdited)="handleEdit($event)">
        </app-brand-form>
      </div>
    }

    <hr />

    <button class="toggle-btn" (click)="toggleShow()">
      {{ showAll() ? '⬆️ Esconder establecimientos' : '⬇️ Mostrar establecimientos' }}
    </button>

    @if (showAll()) {
      <h2>Establecimientos</h2>
      <app-my-establishments
        [idBrand]="brand.id"
        [isInsideBrand]="true">
      </app-my-establishments>
    }
  </div>
}
