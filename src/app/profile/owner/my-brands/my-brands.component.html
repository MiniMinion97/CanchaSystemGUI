
@let brands = this.brands();

@if (brands) {
  <main>
    <section class="establishment-container">
    @for (brand of brands; track brand.id) {
      <table class="establishment-item">
        <thead>
            <tr>
                 <th>nombre</th>
                 <th></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                 <td>{{ brand.brandName }}</td>
                 <td>               
                    <button (click)="handleDetails(brand.id!)">Ver más &RightArrow;</button>
                </td>
            </tr>
        </tbody>
      
    
      </table>
    }
  </section>
  </main>
  
}
