
@let establishments = this.establishments();

@if (establishments) {
  <main>
    <section class="establishment-container">
    @for (establishment of establishments; track establishment.id) {
      <div class="establishment-item">
        {{ establishment.name }}
        <button (click)="navigateToEstablishmentDetails(establishment.id!)">Ver más</button>
      </div>
    }
  </section>
  </main>
  
}
