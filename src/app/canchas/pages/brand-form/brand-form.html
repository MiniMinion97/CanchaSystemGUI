<form [formGroup]="form" (ngSubmit)="handleSubmit()">
  <div class="form-header">
    <span class="header-tag">🏷️ Marca</span>
    <h3>{{ this.isEditing() ? 'Editar marca' : 'Crear marca' }}</h3>
  </div>

  <label>
    Nombre de marca
    <input type="text" formControlName="brandName" placeholder="Ej: La Bombonerita" />

    @if(form.get('brandName')?.touched || form.get('brandName')?.dirty){
      @if(form.get('brandName')?.hasError('required')){
        <span class="field-error">El nombre de la marca es obligatorio</span>
      }@else if(form.get('brandName')?.hasError('minlength')){
        <span class="field-error">El nombre debe tener al menos 3 caracteres</span>
      }
    }
  </label>

  <button type="submit" [disabled]="form.invalid">
    {{ this.isEditing() ? 'Editar marca' : 'Crear marca' }}
  </button>
</form>
