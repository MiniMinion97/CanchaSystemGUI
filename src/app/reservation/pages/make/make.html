<form [formGroup]="form" (ngSubmit)="handleSubmit()" class="reservation-form">
  <!-- Tipo de cancha -->
  <fieldset>
    <legend>Seleccionar tipo de cancha</legend>
    @for (type of canchaTypes(); track type) {
      <div class="radio-option">
        <input
          type="radio"
          [id]="'cancha-' + type"
          formControlName="canchaType"
          [value]="type"
          (change)="onCanchaTypeChange()"
        />
        <label [for]="'cancha-' + type">{{ type }}</label>
      </div>
    }
  </fieldset>

  <!-- Fecha -->
  <div class="form-group">
    <label for="date">Seleccionar fecha:</label>
    <input
      id="date"
      type="date"
      formControlName="date"
      [min]="today"
      (change)="onDateChange($event)"
    />
  </div>

  <!-- Horarios disponibles -->
  @if (availableHours().length) {
    <div class="form-group">
      <label for="hour">Horarios disponibles:</label>
      <select id="hour" formControlName="hour">
        <option value="">Seleccionar hora</option>
        @for (hour of availableHours(); track $index) {
          <option [value]="hour">{{ hour }}</option>
        }
      </select>
    </div>
  }

  @if (loading()) {
    <p class="loading-text">Cargando horarios disponibles...</p>
  }

  <button type="submit" [disabled]="form.invalid || loading()">
    {{ isEditing() ? 'Actualizar reserva' : 'Hacer reserva' }}
  </button>
</form>
