<form [formGroup]="form" (ngSubmit)="handleSubmit()" class="reservation-form">
  <!-- Cancha Type -->
  <fieldset>
    <legend>Choose Cancha Type</legend>
        @for(type of canchaTypes(); track $index){
            <div>
                <input
                    type="radio"
                    [id]="type"
                    formControlName="canchaType"
                    [value]="type"
                />
                <label [for]="type">{{ type }}</label>
            </div>
        }
  </fieldset>

  <!-- Date Picker -->
  <label for="date">Select Date:</label>
  <input
    id="date"
    type="date"
    formControlName="date"
    [min]="today"
  />

  <!-- Hours -->
   @if(availableHours().length){
    <div>
        <label for="hour">Available Hours:</label>
        <select id="hour" formControlName="hour">
            @for(hour of availableHours(); track $index){
                <option [value]="hour">{{ hour }}</option>
            }
        </select>  
    </div>
   }
  
   @if(loading()){
        <p>Cargando horarios disponibles ...</p>     
   }
  
  <button type="submit" [disabled]="form.invalid">Hacer reserva</button>
</form>
