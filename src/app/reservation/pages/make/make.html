<form [formGroup]="form" (ngSubmit)="handleSubmit()" class="reservation-form">
  <!-- Tipo de cancha -->
  <fieldset>
    <legend>Seleccionar tipo de cancha</legend>
    @for (cancha of canchaTypes(); track cancha.id) {
      <div class="radio-option">
        <input
          type="radio"
          [id]="'cancha-' + cancha.id"
          formControlName="canchaId"
          [value]="cancha.id"
        />
        <label [for]="'cancha-' + cancha.id">{{ cancha.type }}</label>
      </div>
    }
  </fieldset>

  <!-- Fecha -->
  <div class="form-group">
    <label for="date">Seleccionar fecha:</label>
    <input
      id="date"
      type="date"
      formControlName="date"
      [min]="today"
    />
  </div>

  <!-- Horarios disponibles -->
  @if (availableHours().length) {
    <div class="form-group">
      <label for="hour">Horarios disponibles:</label>
      <select id="hour" formControlName="hour">
        @for (hour of availableHours(); track $index) {
          <option [value]="hour">{{ hour }}</option>
        }
      </select>
    </div>
  }

  @if (loading()) {
    <p class="loading-text">Cargando horarios disponibles...</p>
  }

  <button type="submit" [disabled]="form.invalid">Hacer reserva</button>
</form>
